name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Nothing here calls Claude or needs a secret. Jobs get write access only where they need it.
permissions:
  contents: read

jobs:
  test:
    name: Build, test and lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle with caching
        uses: gradle/actions/setup-gradle@v6

      - name: Build, run the tests and check the style with ktlint
        run: ./gradlew build

  release:
    name: Release on GitHub
    # Only after a merge to main, and only when the tests above passed
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle with caching
        uses: gradle/actions/setup-gradle@v6

      - name: Read the version from build.gradle.kts
        id: version
        run: |
          version=$(sed -nE 's/^version = "([^"]+)"$/\1/p' build.gradle.kts)
          if [ -z "$version" ]; then echo "No version found in build.gradle.kts"; exit 1; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check whether this version is already released
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.version.outputs.version }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "$TAG is already released; raise the version in build.gradle.kts to publish a new one."
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the distribution zip
        if: steps.existing.outputs.released == 'false'
        run: ./gradlew distZip

      - name: Publish the release
        if: steps.existing.outputs.released == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" "build/distributions/driftcheck-$VERSION.zip" \
            --target "$GITHUB_SHA" --title "driftcheck $VERSION" --generate-notes
