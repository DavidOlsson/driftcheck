name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Nothing here calls Claude or needs a secret. Jobs get write access only where they need it.
permissions:
  contents: read

# Actions are pinned to full commit SHAs, so a moved tag cannot change what runs; the version is in the comment.
jobs:
  test:
    name: Build, test and lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle with caching
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Build, run the tests and check the style with ktlint
        run: ./gradlew build

  release:
    name: Release on GitHub
    # Only after a merge to main, and only when the tests above passed
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Two merges in quick succession must not race to create the same release
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle with caching
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Read the version from build.gradle.kts
        id: version
        run: |
          version=$(sed -nE 's/^version = "([^"]+)"$/\1/p' build.gradle.kts)
          if [ -z "$version" ]; then echo "No version found in build.gradle.kts"; exit 1; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check whether this version is already released
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.version.outputs.version }}
        run: |
          # Only "not found" means it is new; any other failure (network, rate limit) must not lead to a release
          if output=$(gh release view "$TAG" 2>&1); then
            echo "$TAG is already released; raise the version in build.gradle.kts to publish a new one."
            echo "released=true" >> "$GITHUB_OUTPUT"
          elif echo "$output" | grep -qi "release not found"; then
            echo "released=false" >> "$GITHUB_OUTPUT"
          else
            echo "Could not check whether $TAG is released: $output"
            exit 1
          fi

      - name: Build the distribution zip
        if: steps.existing.outputs.released == 'false'
        run: ./gradlew distZip

      - name: Publish the release
        if: steps.existing.outputs.released == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" "build/distributions/driftcheck-$VERSION.zip" \
            --target "$GITHUB_SHA" --title "driftcheck $VERSION" --generate-notes
