name: Wikipedia report

# Runs driftcheck for real against the open source Wikipedia apps and publishes the report on GitHub Pages.
# It uses the owner's Claude subscription, so it only ever starts by hand, never on pull requests.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # The commits the example in examples/ was made from, so reports stay comparable
  ANDROID_REPO: https://github.com/wikimedia/apps-android-wikipedia.git
  ANDROID_COMMIT: 6ed4aa272680a80e40f81f8ece996bc3c0be579a
  IOS_REPO: https://github.com/wikimedia/wikipedia-ios.git
  IOS_COMMIT: 2d6cd1d1a578bee0e19fb89b65302fdc96c2714d
  CLAUDE_CODE_VERSION: 2.1.304

jobs:
  report:
    name: Compare Wikipedia search and publish
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle with caching
        uses: gradle/actions/setup-gradle@v6

      - name: Build driftcheck
        run: ./gradlew installDist

      - name: Fetch the Wikipedia apps at fixed commits
        run: |
          fetch() {
            git init -q "$1"
            git -C "$1" fetch -q --depth 1 "$2" "$3"
            git -C "$1" checkout -q FETCH_HEAD
          }
          fetch demo/wikipedia/android "$ANDROID_REPO" "$ANDROID_COMMIT"
          fetch demo/wikipedia/ios "$IOS_REPO" "$IOS_COMMIT"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install Claude Code
        run: npm install --global "@anthropic-ai/claude-code@$CLAUDE_CODE_VERSION"

      - name: Compare the search feature
        env:
          # The owner's long-lived subscription token from `claude setup-token`; only this step sees it
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: build/install/driftcheck/bin/driftcheck -C demo/wikipedia compare search

      - name: Prepare the site
        run: |
          mkdir site
          cp demo/wikipedia/.driftcheck/reports/search.html site/index.html

      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
