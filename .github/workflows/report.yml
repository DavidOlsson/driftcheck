name: Wikipedia report

# Runs driftcheck for real against the open source Wikipedia apps and publishes the report on GitHub Pages.
# It uses the owner's Claude subscription, so it only ever starts by hand, never on pull requests.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # The commits the example in examples/ was made from, so reports stay comparable
  ANDROID_REPO: https://github.com/wikimedia/apps-android-wikipedia.git
  ANDROID_COMMIT: 6ed4aa272680a80e40f81f8ece996bc3c0be579a
  IOS_REPO: https://github.com/wikimedia/wikipedia-ios.git
  IOS_COMMIT: 2d6cd1d1a578bee0e19fb89b65302fdc96c2714d
  CLAUDE_CODE_VERSION: 2.1.304

# Actions are pinned to full commit SHAs, so a moved tag cannot change what runs next to the token.
# The job with the token can only read; publishing happens in a separate job without it.
jobs:
  compare:
    name: Compare Wikipedia search
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle with caching
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Build driftcheck
        run: ./gradlew installDist

      - name: Fetch the Wikipedia apps at fixed commits
        run: |
          fetch() {
            git init -q "$1"
            git -C "$1" fetch -q --depth 1 "$2" "$3"
            git -C "$1" checkout -q FETCH_HEAD
          }
          fetch demo/wikipedia/android "$ANDROID_REPO" "$ANDROID_COMMIT"
          fetch demo/wikipedia/ios "$IOS_REPO" "$IOS_COMMIT"

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Install Claude Code
        run: npm install --global "@anthropic-ai/claude-code@$CLAUDE_CODE_VERSION"

      - name: Compare the search feature
        env:
          # The owner's long-lived subscription token from `claude setup-token`; only this step sees it
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: build/install/driftcheck/bin/driftcheck -C demo/wikipedia compare search

      # Kept even when the run fails, to see what went wrong, and to rebuild or compare reports later
      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: driftcheck-results
          path: demo/wikipedia/.driftcheck/
          if-no-files-found: ignore
          retention-days: 30

      - name: Prepare the site
        run: |
          mkdir site
          cp demo/wikipedia/.driftcheck/reports/search.html site/index.html

      - name: Upload the site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: Publish on GitHub Pages
    needs: compare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
